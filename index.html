    window.compressImageFile = (file, callback) => {
      const reader = new FileReader();
      let completed = false;
      const complete = (dataUrl) => {
        if (completed) return;
        completed = true;
        callback(dataUrl);
      };

      reader.onerror = () => {
        console.error("Image file could not be read.");
      };
      reader.onload = (e) => {
        const originalDataUrl = e.target.result;
        const img = new Image();
        img.onerror = () => complete(originalDataUrl);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 900;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxDim) {
              height = Math.round(height * (maxDim / width));
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round(width * (maxDim / height));
              height = maxDim;
            }
          }
          if (!width || !height) {
            complete(originalDataUrl);
            return;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            complete(originalDataUrl);
            return;
          }
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.58;
          let compressedBase64 = canvas.toDataURL('image/jpeg', quality);
          let attempts = 0;
          while (compressedBase64.length > 700000 && attempts < 6) {
            quality = Math.max(0.18, quality - 0.08);
            compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            attempts += 1;
          }
          complete(compressedBase64);
        };
        img.src = originalDataUrl;
      };

      const originalLength = dataUrl.length;
      if (originalLength <= maxBytes) return dataUrl;

      const img = new Image();
      return new Promise((resolve) => {
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const scale = Math.min(1, Math.sqrt(maxBytes / originalLength));
          width = Math.max(120, Math.round(width * scale));
          height = Math.max(120, Math.round(height * scale));
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            resolve(dataUrl);
            return;
          }
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.58;
          let result = canvas.toDataURL('image/jpeg', quality);
          while (result.length > maxBytes && quality > 0.14) {
            quality -= 0.08;
            result = canvas.toDataURL('image/jpeg', quality);

          resolve(result);

    store.getApprovedProductReviews = function(productId) {
      return this.reviews.filter(review => String(review.productId || '') === String(productId) && review.status === 'approved');
    };

    store.getProductRating = function(productId) {
      const approvedReviews = this.getApprovedProductReviews(productId);
      if (approvedReviews.length === 0) return { average: 0, count: 0 };
      const total = approvedReviews.reduce((sum, review) => sum + Math.min(5, Math.max(1, Number(review.rating) || 0)), 0);
      return { average: Math.round((total / approvedReviews.length) * 10) / 10, count: approvedReviews.length };
    };

    store.getRatingStarsMarkup = function(rating) {

    store.updateSeo = function(product = null) {
      const pathname = window.location.pathname || '/';
      const normalizedPath = pathname === '/' ? '/' : pathname.replace(/\/+$/, '') || '/';
      if (!product && normalizedPath.startsWith('/product/')) {
        const routeSlugOrId = decodeURIComponent(normalizedPath.replace('/product/', ''));
        product = this.products.find(candidate => String(candidate.id) === routeSlugOrId || slugifyProductName(candidate.name) === slugifyProductName(routeSlugOrId)) || null;
      }
      if (!product && this.currentlyOpenProductId) {
        product = this.products.find(candidate => String(candidate.id) === String(this.currentlyOpenProductId)) || null;
      }
      const isProductPage = Boolean(product && (normalizedPath.startsWith('/product/') || String(this.currentlyOpenProductId) === String(product.id)));
      const seoPath = isProductPage ? getProductRoutePath(product) : normalizedPath;
      const publicPage = !['/admin', '/cart', '/checkout', '/payment', '/bank-transfer', '/order-confirmation', '/orders', '/wishlist'].includes(seoPath);
      const cleanProductName = product?.name ? String(product.name).replace(/\s*\(\s*(Les Hommes|Les Filles|Men|Women|Men's Packs|Women's Packs)\s*\)\s*/gi, '').trim() : '';
      const productDescription = String(product?.description || '').replace(/\s+/g, ' ').trim();
      const configuredDescription = String(this.settings.seoDescription || this.settings.websiteDescription || '').replace(/\s+/g, ' ').trim();
      const description = isProductPage
        ? `Découvrez ${cleanProductName} chez SOVANEX, dans la collection ${String(product.category || 'exclusive').trim()}. ${productDescription}`.slice(0, 160)
        : normalizedPath === '/shop'
          ? 'Explorez la boutique SOVANEX: montres, accessoires et articles en cuir sélectionnés avec soin au Maroc.'
          : (configuredDescription || 'Découvrez SOVANEX, une sélection de montres, accessoires et articles en cuir d’exception au Maroc.');
      const title = isProductPage
        ? `${cleanProductName} | SOVANEX`
        : normalizedPath === '/shop' ? 'Boutique SOVANEX | Montres et accessoires au Maroc' : (this.settings.seoTitle || this.settings.websiteTitle || 'SOVANEX | Montres, accessoires et articles en cuir');
      const absoluteUrl = value => {
        if (/^https?:\/\//i.test(String(value || ''))) return String(value);
        const base = /^https?:$/i.test(window.location.protocol) ? window.location.origin : '';
        return `${base}${value}`;
      };

      document.title = title;
      const descriptionMeta = document.querySelector('meta[name="description"]');
      if (descriptionMeta) descriptionMeta.setAttribute('content', description);
      const keywordsMeta = document.querySelector('meta[name="keywords"]') || (() => {
        const meta = document.createElement('meta');
        meta.name = 'keywords';
        document.head.appendChild(meta);
        return meta;
      })();
      keywordsMeta.setAttribute('content', this.settings.seoKeywords || '');
      const robotsMeta = document.querySelector('meta[name="robots"]');
      if (robotsMeta) robotsMeta.setAttribute('content', publicPage && this.settings.robotsIndexing !== false ? 'index,follow' : 'noindex,nofollow');
      let canonical = document.querySelector('link[rel="canonical"]');
      if (!canonical) {
        canonical = document.createElement('link');
        canonical.rel = 'canonical';
        document.head.appendChild(canonical);
      }
      canonical.href = absoluteUrl(seoPath);

      const setMeta = (property, content) => {
        let meta = document.querySelector(`meta[property="${property}"]`);
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('property', property);
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', content || '');
      };
      setMeta('og:title', this.settings.ogTitle || title);
      setMeta('og:description', this.settings.ogDescription || description);
      setMeta('og:url', absoluteUrl(seoPath));
      if (this.settings.ogImage) setMeta('og:image', absoluteUrl(this.settings.ogImage));

      const existingSchema = document.getElementById('sovanex-product-schema');
      if (existingSchema) existingSchema.remove();
      if (!isProductPage) return;

      const rating = this.getProductRating(product.id);
      const images = [product.imageURL, product.storeImage, product.homeImage, product.desktopImage, product.mobileImage, product.tabletImage]
        .concat(Array.isArray(product.galleryImages) ? product.galleryImages : String(product.galleryImages || '').split(','))
        .concat((product.variations || []).flatMap(variation => [variation?.imageURL, variation?.mobileImage]))
        .filter(image => typeof image === 'string' && image.trim())
        .map(image => absoluteUrl(image.trim()));
      const schema = {
        '@context': 'https://schema.org',
        '@type': 'Product',
        name: cleanProductName,
        description: productDescription || description,
        image: [...new Set(images)],
        brand: { '@type': 'Brand', name: 'SOVANEX' },
        url: absoluteUrl(getProductRoutePath(product)),
        offers: {
          '@type': 'Offer',
          price: Number(product.discountPrice || product.price || 0),
          priceCurrency: 'MAD',
          availability: product.isOutOfStock === true || Number(product.stock || 0) <= 0 ? 'https://schema.org/OutOfStock' : 'https://schema.org/InStock',
          url: absoluteUrl(getProductRoutePath(product))
        }
      };
      if (rating.count > 0) {
        schema.aggregateRating = {
          '@type': 'AggregateRating',
          ratingValue: rating.average,
          reviewCount: rating.count,
          bestRating: 5,
          worstRating: 1
        };
      }
      const schemaScript = document.createElement('script');
      schemaScript.id = 'sovanex-product-schema';
      schemaScript.type = 'application/ld+json';
      schemaScript.textContent = JSON.stringify(schema).replace(/</g, '\\u003c');
      document.head.appendChild(schemaScript);
    };

    const createAuditedSnapshot = (scope, listenerName, source, handler, errorHandler) => {
      const resourceKey = scope === 'admin' ? listenerName : null;
      if (resourceKey && store.activeSubscriptions.adminResources[resourceKey]) {
        store.activeSubscriptions.adminResources[resourceKey]();
      }
      auditFirestoreRead('onSnapshot', listenerName, 'Realtime listener creation', `init${scope[0].toUpperCase()}${scope.slice(1)}Subscriptions`);
      const unsubscribe = onSnapshot(source, handler, errorHandler);
      let unsubscribed = false;
      let trackedUnsubscribe;
      trackedUnsubscribe = store.trackSubscription(scope, () => {
        if (unsubscribed) return;
        unsubscribed = true;
        console.log('[FIRESTORE AUDIT] LISTENER UNSUBSCRIBED', {
          listener: listenerName,
          scope,
          timestamp: new Date().toISOString(),
          component: `cleanupSubscriptions(${scope})`
        });
        unsubscribe();
        if (resourceKey && store.activeSubscriptions.adminResources[resourceKey] === trackedUnsubscribe) {
          delete store.activeSubscriptions.adminResources[resourceKey];
        }
      });
      if (resourceKey) store.activeSubscriptions.adminResources[resourceKey] = trackedUnsubscribe;
      return trackedUnsubscribe;
    };

    store.initPublicSubscriptions = function(forceBypass = false) {
      if (this.activeSubscriptions.public) return;
      if (!auth.currentUser && !forceBypass) return;
      this.activeSubscriptions.public = true;

      const publicCacheTTL = 5 * 60 * 1000;
      const maxCacheBytes = 100 * 1024;
      const productCacheKey = "sovanex_products_firestore_cache";
      const compactProductCache = products => products.map(product => ({
        id: product.id,
        name: product.name,
        category: product.category,
        gender: product.gender,
        price: product.price,
        discountPrice: product.discountPrice,
        stock: product.stock,
        rating: product.rating,
        reviewsCount: product.reviewsCount,
        isPromotion: product.isPromotion,
        isBestSeller: product.isBestSeller,
        limitedStock: product.limitedStock,
        isPinned: product.isPinned,
        freeDelivery: product.freeDelivery,
      }));
      const writePublicCache = (cacheKey, data) => {
        try {
          const cacheData = cacheKey === productCacheKey && Array.isArray(data)
            ? compactProductCache(data)
            : data;
          const serialized = JSON.stringify({ timestamp: Date.now(), data: cacheData });
          const serializedBytes = new Blob([serialized]).size;
          if (serializedBytes > maxCacheBytes) {
            console.warn("Skipping local Firestore cache because it exceeds the size limit.", {
              cacheKey,
              serializedBytes,
              maxCacheBytes
            });
            localStorage.removeItem(cacheKey);
            return;
          }
          localStorage.setItem(cacheKey, serialized);
        } catch (err) {
          console.warn("Could not update local Firestore cache; continuing without cache:", err);
          try {
            localStorage.removeItem(cacheKey);
          } catch (removeErr) {
            console.warn("Could not remove local Firestore cache:", removeErr);
          }
        }
      };
      const readCachedCollection = async (cacheKey, source, collectionName, reason) => {
        if (!store.isAdmin && cacheKey !== productCacheKey) {
          try {
            const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
            if (cached && Date.now() - cached.timestamp < publicCacheTTL && Array.isArray(cached.data)) {
              return cached.data;
            }
          } catch (err) {
            localStorage.removeItem(cacheKey);
          }
        }

        auditFirestoreRead('getDocs', collectionName, reason, 'initPublicSubscriptions.readCachedCollection');
        const snap = await getDocs(source);
        const data = [];
        snap.forEach(snapshotDoc => data.push({ id: snapshotDoc.id, ...snapshotDoc.data() }));
        if (!store.isAdmin) writePublicCache(cacheKey, data);
        return data;

    store.getProductInventory = function(product, variationIndex = null) {
      const variation = Number.isInteger(variationIndex) ? product?.variations?.[variationIndex] : null;
      return variation && (Array.isArray(variation.sizes) || variation.stock !== undefined)
        ? variation
        : (product || {});
    };

    store.getProductSizes = function(product, variationIndex = null) {
      const inventory = this.getProductInventory(product, variationIndex);
      if (!Array.isArray(inventory.sizes) || inventory.sizes.length === 0) return [];
      return inventory.sizes
        .map(size => {
          const label = String(size?.label ?? size?.name ?? size?.size ?? '').trim();
          const stock = Number(size?.stock ?? 0);
          return label ? { label, stock: Number.isFinite(stock) ? stock : 0 } : null;
        })
        .filter(Boolean);
    };

    store.getProductSizeStock = function(product, sizeLabel, variationIndex = null) {
      if (!product) return 0;
      const inventory = this.getProductInventory(product, variationIndex);
      if (!sizeLabel) return Number(inventory.stock || 0);
      const sizeMatch = this.getProductSizes(product, variationIndex).find(size => size.label.toLowerCase() === String(sizeLabel).trim().toLowerCase());
      return sizeMatch ? Number(sizeMatch.stock || 0) : Number(inventory.stock || 0);
    };

    store.addToCart = function(product, customItem = null) {
      if (product?.isOutOfStock === true) {
        showToast("Ce produit est actuellement en rupture de stock.", "error");
        return;
      }
      const itemToSelect = customItem || {
        id: product.id,
        name: product.name,
        price: product.discountPrice || product.price,
        imageURL: product.imageURL,
        category: product.category,
        gender: product.gender,
        stock: product.stock,
        freeDelivery: product.freeDelivery === true
      };

      const itemStock = Number(itemToSelect.stock ?? product.stock ?? 0);
      const hasExplicitQuantity = Boolean(customItem && Number.isFinite(Number(customItem.quantity)));
      const requestedQuantity = Math.max(1, Math.floor(Number(itemToSelect.quantity) || 1));
      const itemSizeKey = String(itemToSelect.size || '').trim();
      const match = this.cart.find(item => item.id === itemToSelect.id && String(item.size || '') === itemSizeKey);
      const currentQuantity = match ? Number(match.quantity || 0) : 0;
      const nextQuantity = hasExplicitQuantity ? requestedQuantity : currentQuantity + requestedQuantity;
      if (Number.isFinite(itemStock) && itemStock >= 0 && nextQuantity > itemStock) {
        showToast("Vous avez atteint le stock disponible maximum.", "error");
        return;
      }
      if (match) {
        match.quantity = nextQuantity;
        if (itemToSelect.color) match.color = itemToSelect.color;
      } else {
        this.cart.push({ ...itemToSelect, quantity: requestedQuantity });
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      showToast('"' + itemToSelect.name + '" added to cart.');
      this.updateDOM();
    };

    store.isProductOutOfStock = function(product, variationIndex = null, sizeLabel = null) {
      if (!product || product.isOutOfStock === true) return true;
      const availableStock = sizeLabel
        ? this.getProductSizeStock(product, sizeLabel, variationIndex)
        : Number(this.getProductInventory(product, variationIndex).stock || 0);
      return Number.isFinite(availableStock) && availableStock <= 0;
    };

    store.loadOrderHistory = async function() {
      const localHistory = JSON.parse(localStorage.getItem("sovanex_order_history")) || [];
      const orderIds = localHistory.slice(-10);
      const historyKey = orderIds.join("|");
      if (orderIds.length === 0) return [];

      const activeRequest = this.activeSubscriptions.orderHistoryRequest;
      if (this.activeSubscriptions.orderHistoryKey === historyKey) {
        if (activeRequest) return activeRequest;
        return this.myOrders;
      }

      this.activeSubscriptions.orderHistoryKey = historyKey;
      this.activeSubscriptions.orderHistoryRequest = (async () => {
        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        const q = query(ordersCol, where("orderId", "in", orderIds));

          const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
          return dateB - dateA;
        });
        this.myOrders = list;
        return list;
      })();

      try {
        return await this.activeSubscriptions.orderHistoryRequest;

    store.updateQty = function(id, delta) {
      const match = this.cart.find(item => item.id === id);
      if (!match) return;

      const stockLimit = Number(match.stock);
      const currentQuantity = Number(match.quantity || 0);
      const nextQuantity = currentQuantity + delta;
      if (delta > 0 && Number.isFinite(stockLimit) && stockLimit >= 0 && nextQuantity > stockLimit) {
        showToast("You have reached the maximum available stock.", "error");
        return;
      }

      match.quantity = nextQuantity;
      if (match.quantity <= 0) {
        this.cart = this.cart.filter(item => item.id !== id);
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();
    };

    store.getRecommendations = function(purchasedItemIds) {
      const purchasedItems = store.products.filter(p => purchasedItemIds.includes(p.id));
      const purchasedCategories = [...new Set(purchasedItems.map(p => p.category))];
      const purchasedGenders = [...new Set(purchasedItems.map(p => getNormalizedGender(p.gender)))];

      let candidates = store.products.filter(p => !purchasedItemIds.includes(p.id));

      candidates = candidates.map(p => {
        let score = 0;
        if (purchasedCategories.includes(p.category)) score += 3;
        if (purchasedGenders.includes(getNormalizedGender(p.gender))) score += 2;
        if (p.isBestSeller) score += 1;
        return { product: p, score };
      });

      candidates.sort((a, b) => b.score - a.score);

      return candidates.slice(0, 3).map(c => c.product);
    };

    // Chart.js Lazy Loader
    let chartLoaderPromise = null;
    const loadChartLibrary = () => {
      if (chartLoaderPromise) return chartLoaderPromise;
      chartLoaderPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/chart.js";
        script.onload = () => resolve(window.Chart);
        script.onerror = () => reject(new Error("Analytics Engine Load Failure"));
        document.head.appendChild(script);
      });
      return chartLoaderPromise;
    };

    store.renderAnalyticsChart = function() {
      const canvas = document.getElementById("analyticsChart");
      if (!canvas) return;

      loadChartLibrary().then((Chart) => {
        const nonCancelled = store.orders.filter(o => o.status !== 'cancelled');
        const dailySales = {};
        const labels = [];
        const dayNames = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
        
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateString = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const dayLabel = dayNames[d.getDay()] + " (" + dateString + ")";
          labels.push(dayLabel);
          dailySales[dateString] = 0;
        }

        nonCancelled.forEach(order => {
          if (order.createdAt) {
            const orderDate = order.createdAt.toDate ? order.createdAt.toDate() : new Date(order.createdAt);
            const dateKey = orderDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            if (dailySales[dateKey] !== undefined) {
              dailySales[dateKey] += order.total;
            }
          }
        });

        const dataset = Object.keys(dailySales).map(key => dailySales[key]);

        if (window.analyticsChartInstance) {
          window.analyticsChartInstance.destroy();
        }

        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 240);
        gradient.addColorStop(0, 'rgba(212, 175, 55, 0.45)');
        gradient.addColorStop(1, 'rgba(10, 10, 10, 0.05)');

        window.analyticsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Chiffre d’affaires quotidien (MAD)',
              data: dataset,
              borderColor: 'var(--accent-color)',
              borderWidth: 3,
              backgroundColor: gradient,
              fill: true,
              tension: 0.4,
              pointBackgroundColor: '#000000',
              pointBorderColor: 'var(--accent-color)',
              pointRadius: 6,
              pointHoverRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { 
                grid: { color: 'rgba(212, 175, 55, 0.08)' },
                min: 0,
                beginAtZero: true
              },
              x: { grid: { display: false } }
            }
          }
        });
      }).catch(err => console.error(err));
    };

    store.isCartItemFreeDelivery = function(item) {
      if (item.freeDelivery) return true;
      const baseProductId = String(item.id || '').replace(/-v\d+$/, '');
      const product = this.products.find(candidate => candidate.id === baseProductId);
      return Boolean(product?.freeDelivery);
    };

    store.getCartDeliveryFee = function(city) {
      const subtotal = this.getCartSubtotal();
      const threshold = this.getFreeDeliveryThreshold();

      if (this.cart.some(item => this.isCartItemFreeDelivery(item))) return 0;
      if (!city) {
        return subtotal >= threshold ? 0 : STANDARD_DELIVERY_FEE;
      }

      const cityPrice = Number(city.price ?? STANDARD_DELIVERY_FEE);
      if (city.freeDelivery || subtotal >= threshold) return 0;
      return Number.isFinite(cityPrice) && cityPrice > 0 ? cityPrice : STANDARD_DELIVERY_FEE;
    };

    store.getCartSubtotal = function() {
      return this.cart.reduce((sum, item) => sum + ((Number(item.discountPrice || item.price) || 0) * (Number(item.quantity) || 0)), 0);
    };

    store.findPromoCode = function(code) {
      const normalizedCode = String(code || '').trim().toUpperCase();
      return this.promoCodes.find(promo => String(promo.code || '').trim().toUpperCase() === normalizedCode) || null;
    };

    store.validatePromoCode = function(code) {
      const promo = this.findPromoCode(code);
      if (!promo) return { valid: false, message: "Ce code promotionnel n'existe pas." };
      if (promo.isActive === false) return { valid: false, message: "Ce code promotionnel est désactivé." };
      const maxUses = Number(promo.maxUses ?? 1);
      const usesCount = Number(promo.usesCount ?? 0);
      if (Number.isFinite(maxUses) && maxUses > 0 && usesCount >= maxUses) return { valid: false, message: "La limite d'utilisation de ce code est atteinte." };
      if (promo.expiresAt) {
        const expiry = promo.expiresAt?.toDate ? promo.expiresAt.toDate() : new Date(promo.expiresAt);
        if (!Number.isNaN(expiry.getTime()) && expiry.getTime() < Date.now()) {
          return { valid: false, message: "Ce code promotionnel a expiré." };
        }
      }
      const discountPercent = Number(promo.discountPercent);
      if (!Number.isFinite(discountPercent) || discountPercent <= 0 || discountPercent > 100) {
        return { valid: false, message: "La remise de ce code promotionnel est invalide." };
      }
      const subtotal = this.getCartSubtotal();
      const discountAmount = Math.round(subtotal * discountPercent) / 100;
      return { valid: true, promo, discountPercent, discountAmount };
    };

    store.getCartTotals = function() {
      const subtotal = this.getCartSubtotal();
      const applied = this.appliedPromoCode ? this.validatePromoCode(this.appliedPromoCode.code) : { valid: false };
      const discountPercent = applied.valid ? applied.discountPercent : 0;
      const discountAmount = applied.valid ? Math.min(applied.discountAmount, subtotal) : 0;
      const city = this.deliveryCities.find(item => item.id === this.checkoutFormValues.cityId);
      const deliveryFee = this.getCartDeliveryFee(city);
      return { subtotal, subtotalAfterDiscount: Math.max(0, subtotal - discountAmount), discountPercent, discountAmount, deliveryFee, total: Math.max(0, subtotal - discountAmount + deliveryFee) };
    };

    store.applyPromoCode = function(code) {
      const result = this.validatePromoCode(code);
      this.promoCodeInput = String(code || '').trim().toUpperCase();
      if (!result.valid) {
        this.appliedPromoCode = null;
        this.promoCodeMessage = result.message;

        return false;

      this.promoCodeMessage = `${result.promo.code} applied: ${result.discountPercent}% discount.`;
      this.promoCodeMessageType = "success";
      return true;

    store.resetCheckoutState = function() {

    store.submitUnifiedOrder = async function({
      customerName,
      phone,
      cityId,
      address,
      paymentMethod,
      paymentStatus,
      paymentProofData,
      paymentProofName,
      selectedBankId,
      bankSnapshot
    }) {
      if (!customerName || !phone || !cityId || !address) {
        showToast("Please fill in all required delivery coordinates.", "error");
        return null;
      }

      const normalizedPaymentMethod = paymentMethod === 'cod' ? 'Cash on Delivery' :
        paymentMethod === 'bank' ? 'Bank Transfer' :
        (paymentMethod || 'Cash on Delivery');

      // Validate bank selection for bank transfer
      if (normalizedPaymentMethod === 'Bank Transfer') {
        if (!selectedBankId || !bankSnapshot) {
          showToast("Please select a bank account for this transfer.", "error");
          return null;
        }
      }

      const requireProof = normalizedPaymentMethod !== 'Cash on Delivery' && this.settings?.paymentProofRequired !== false;
      if (requireProof && (!paymentProofData || !String(paymentProofData).trim())) {
        showToast("Veuillez importer un justificatif de paiement avant d'envoyer la commande.", "error");
        return null;
      }

      const promoValidation = this.appliedPromoCode ? this.validatePromoCode(this.appliedPromoCode.code) : { valid: false };
      if (this.appliedPromoCode && !promoValidation.valid) {
        this.removePromoCode();
        showToast(promoValidation.message || "Ce code promotionnel n'est plus valide.", "error");
        return null;
      }
      const subtotal = this.getCartSubtotal();
      const discountPercent = promoValidation.valid ? promoValidation.discountPercent : 0;
      const discountAmount = promoValidation.valid ? Math.min(promoValidation.discountAmount, subtotal) : 0;
      const cityObj = this.deliveryCities.find(c => c.id === cityId);
      const deliveryFee = this.getCartDeliveryFee(cityObj);
      const cityName = cityObj ? cityObj.name : "Morocco";
      const total = Math.max(0, subtotal - discountAmount + deliveryFee);
      const orderId = "SOV-" + Math.floor(100000 + Math.random() * 900000);

      const orderItems = this.cart.map(item => ({
        id: item.id,
        name: item.name,
        quantity: item.quantity,
        price: item.discountPrice || item.price,
        imageURL: item.imageURL || item.image || fallbackImage,
        color: item.color ? { name: item.color.name, value: item.color.value || item.color.hex } : null,
        size: item.size || null
      }));

      const orderData = {
        orderId,
        items: orderItems,
        total,
        subtotal,
        promoCode: promoValidation.valid ? String(promoValidation.promo.code).trim().toUpperCase() : null,
        discountPercent,
        discountAmount,
        deliveryFee,
        deliveryCity: cityName,
        customerName,
        phone,
        address,
        status: "pending",
        paymentMethod: normalizedPaymentMethod,
        paymentStatus: paymentStatus || (normalizedPaymentMethod === 'Cash on Delivery' ? 'Pending' : 'Proof Submitted'),
        paymentProofName: paymentProofName || '',
        createdAt: new Date()
      };

      // Save bank snapshot for bank transfer orders
      if (normalizedPaymentMethod === 'Bank Transfer' && bankSnapshot) {
        orderData.bankSnapshot = bankSnapshot;
        orderData.selectedBankId = selectedBankId;
      }

      const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
      if (promoValidation.valid) {
        const promoRef = doc(db, 'artifacts', appId, 'public', 'data', 'promoCodes', promoValidation.promo.id);
        const orderRef = doc(ordersCol);
        await runTransaction(db, async transaction => {
          const promoSnapshot = await transaction.get(promoRef);
          const freshPromo = promoSnapshot.exists() ? promoSnapshot.data() : null;
          const maxUses = Number(freshPromo?.maxUses ?? 1);
          const usesCount = Number(freshPromo?.usesCount ?? 0);
          const expiry = freshPromo?.expiresAt ? new Date(freshPromo.expiresAt) : null;
          if (!freshPromo || freshPromo.isActive === false || usesCount >= maxUses || Number(freshPromo.discountPercent) !== discountPercent || (expiry && !Number.isNaN(expiry.getTime()) && expiry.getTime() < Date.now())) throw new Error('Ce code promotionnel n\'est plus disponible.');
          transaction.set(orderRef, orderData);
          transaction.update(promoRef, { usesCount: increment(1), updatedAt: new Date() });
        });
      } else {
        await addDoc(ordersCol, orderData);
      }

      const localHistory = JSON.parse(localStorage.getItem("sovanex_order_history")) || [];
      localHistory.push(orderId);
      localStorage.setItem("sovanex_order_history", JSON.stringify(localHistory));

      let productsMsg = "";
      this.cart.forEach(item => {
        const colorText = item.color?.name ? " - Color: " + item.color.name : "";
        productsMsg += "• *" + item.name + "* x" + item.quantity + colorText + " (" + (item.discountPrice || item.price) + " MAD)\n";
      });

      const paymentProofText = orderData.paymentProofName || 'Not provided';

      let msgText = this.telegramSettings.template
        .replace(/{products}/g, productsMsg.trim())
        .replace(/{subtotal}/g, subtotal)
        .replace(/{city}/g, cityName)
        .replace(/{delivery}/g, deliveryFee)
        .replace(/{total}/g, total)
        .replace(/{name}/g, customerName)
        .replace(/{address}/g, address)
        .replace(/{phone}/g, phone)
        .replace(/{orderId}/g, orderId)
        .replace(/{paymentMethod}/g, normalizedPaymentMethod)
        .replace(/{paymentStatus}/g, orderData.paymentStatus)
        .replace(/{paymentProof}/g, paymentProofText);

      if (!msgText.includes('{paymentMethod}') && !msgText.includes('Payment Method')) {
        msgText += `\n\nPayment Method: ${normalizedPaymentMethod}\nPayment Status: ${orderData.paymentStatus}\nPayment Proof: ${paymentProofText}`;
      }

      // FIX: Make Telegram notification non-blocking with timeout to prevent infinite "Processing Request..." state
      if (this.telegramSettings.botEnabled && this.telegramSettings.botToken && this.telegramSettings.chatId) {
        const telegramUrl = "https://api.telegram.org/bot" + this.telegramSettings.botToken + "/sendMessage";
        const telegramPayload = {
          chat_id: this.telegramSettings.chatId,
          text: msgText,
          parse_mode: "Markdown"
        };
        
        // Send notification without blocking order completion
        fetch(telegramUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(telegramPayload)
        }).catch(err => {
          console.error("Telegram notification failed after order creation:", err);
        });
      }

      return { orderId, orderData };
    };

        triggerConfirm(

              '<span class="inline-block bg-black/80 text-luxuryGold font-mono text-base font-bold px-4 py-2 rounded-lg border border-luxuryGold/40 tracking-wider select-all cursor-pointer hover:border-luxuryGold transition" title="Double click to select and copy">' + result.orderId + '</span>' +
            '</div>' +

            recommendationsMarkup +

        );

        setTimeout(() => {
          document.querySelectorAll(".rec-view-product-btn").forEach(btn => {

    store.bindProductCardClicks = function() {
      document.querySelectorAll(".wishlist-toggle-btn").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          this.toggleWishlist(el.getAttribute("data-id"));
        };
      });

      document.querySelectorAll(".card-img-trigger, .card-title-trigger").forEach(el => {
        el.onclick = (event) => {
          event.preventDefault();
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.openProductDetailsModal(prod);
        };
      });

      document.querySelectorAll(".add-to-cart-btn").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          if (el.disabled) return;
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod && el.dataset.directCart === 'true') {
            store.addToCart(prod);
          } else if (prod) {
            store.openProductDetailsModal(prod, 'add-to-cart');
          }
        };
      });

      document.querySelectorAll(".order-now-btn").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          if (el.disabled) return;
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.openProductDetailsModal(prod, 'order');
        };
      });
    };

    store.renderShopPage = function() {
      const container = document.getElementById("app-content");
      if (!container) return;
      const configuredMin = Math.max(0, Number(this.settings.priceFilterMin ?? 0));
      const configuredMax = Math.max(configuredMin, Number(this.settings.priceFilterMax ?? 2000));
      const selectedMin = Math.min(Math.max(this.priceMin ?? configuredMin, configuredMin), configuredMax);
      const selectedMax = Math.max(Math.min(this.priceMax ?? configuredMax, configuredMax), selectedMin);
      this.priceMin = selectedMin;
      this.priceMax = selectedMax;
      
      const filtered = this.products.filter(p => {
        const isVisibleCatalogItem = isStorefrontProduct(p);
        const matchesCategory = this.selectedCategory === "All" || p.category === this.selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                              p.description.toLowerCase().includes(this.searchQuery.toLowerCase());
        const productPrice = Number(p.discountPrice || p.price || 0);
        const minimumPrice = selectedMin;
        const maximumPrice = selectedMax;
        const matchesPrice = productPrice >= minimumPrice && productPrice <= maximumPrice;
        return isVisibleCatalogItem && matchesCategory && matchesSearch && matchesPrice;
      }).sort((a, b) => {
        const aPinned = a.isPinned ? 1 : 0;
        const bPinned = b.isPinned ? 1 : 0;
        if (bPinned !== aPinned) {
          return bPinned - aPinned; // Pinned items always go first
        }
        const aTime = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
        const bTime = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
        return bTime - aTime; // Newest secondary sort
      });

      let productsGrid = "";
      if (this.loadingProducts && filtered.length === 0) {
        productsGrid = Array(6).fill(this.createSkeletonCardMarkup()).join('');
      } else if (filtered.length === 0) {
        productsGrid = `
          <div class="col-span-full text-center py-16 bg-luxuryBeige rounded-3xl border border-luxuryGold/10 w-full">
            <p class="text-sm text-gray-400 italic">${this.t('noProductsFound')}</p>
          </div>
        `;
      } else {
        productsGrid = filtered.map(p => this.createProductCardMarkup(p, 'store')).join('');
      }

      // Check if products grid container is already rendered in the DOM to keep input focus intact
      const existingGridContainer = document.getElementById("shop-products-grid-container");
      if (existingGridContainer) {
        const existingPriceMin = document.getElementById("shop-price-min");
        const existingPriceMax = document.getElementById("shop-price-max");
        const boundsChanged = existingPriceMin && existingPriceMax && (Number(existingPriceMin.min) !== configuredMin || Number(existingPriceMax.max) !== configuredMax);
        if (!boundsChanged) {
          existingGridContainer.innerHTML = productsGrid;
          this.bindProductCardClicks();
          return;
        }
        existingGridContainer.removeAttribute("id");
      }

      let categoryButtons = `
        <button class="category-filter-btn text-left px-4 py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-premium ${
          this.selectedCategory === "All" ? 'bg-luxuryGold text-black shadow-sm' : 'text-white hover:bg-white/5'
        }" data-name="All">${this.t('allCategories')}</button>
      `;

      categoryButtons += this.categories.filter(c => c.isActive).map(c => `
        <button class="category-filter-btn text-left px-4 py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-premium ${
          this.selectedCategory === c.name ? 'bg-luxuryGold text-black shadow-sm' : 'text-white hover:bg-white/5'
        }" data-name="${c.name}">${c.name}</button>
      `).join('');

      container.innerHTML = `

          <!-- STICKY FLOATING BACK-TO-HOME CAPSULE -->

              ${this.t('backToHome')}
            </button>
          </div>

          <div class="text-center space-y-3 pt-8">
            <span class="text-xs uppercase tracking-widest text-luxuryGold font-semibold">${this.t('storeCollections')}</span>
            <h1 class="text-4xl font-serif text-white">${this.t('shop')}</h1>
            <div class="w-12 h-0.5 bg-luxuryGold mx-auto mt-2"></div>
          </div>

          <div class="max-w-xl mx-auto space-y-4">
            <div class="relative w-full">
              <input id="shop-search-input" type="text" placeholder="${this.t('searchBoutique')}" value="${this.searchQuery}" class="w-full pl-10 pr-4 py-3 text-xs rounded-xl border border-luxuryGold/30 bg-white/5 focus:outline-none focus:border-luxuryGold text-white transition-premium">

          </div>

          <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-6">
              <div class="bg-luxuryBeige p-6 rounded-3xl border border-luxuryGold/15 shadow-sm space-y-4">
                <p class="text-[10px] font-bold text-luxuryGold uppercase tracking-wider border-b border-luxuryGold/10 pb-2">${this.t('atelierCollections')}</p>
                <div class="flex flex-col gap-1.5">
                  ${categoryButtons}
                </div>
                <div class="border-t border-luxuryGold/10 pt-4 space-y-3">
                  <div class="flex items-center justify-between">
                    <p class="text-[10px] font-bold text-luxuryGold uppercase tracking-wider">Filtrer par prix</p>
                    <span id="shop-price-range-label" class="text-[10px] text-white font-bold">${selectedMin} DH — ${selectedMax} DH</span>
                  </div>
                  <div class="relative h-8 flex items-center">
                    <div class="absolute left-0 right-0 h-1 rounded-full bg-white/15"></div>
                    <div id="shop-price-range-fill" class="absolute h-1 rounded-full bg-luxuryGold" style="left:${configuredMax === configuredMin ? 0 : ((selectedMin - configuredMin) / (configuredMax - configuredMin)) * 100}%;right:${configuredMax === configuredMin ? 0 : 100 - ((selectedMax - configuredMin) / (configuredMax - configuredMin)) * 100}%"></div>
                    <input id="shop-price-min" type="range" min="${configuredMin}" max="${configuredMax}" step="1" value="${selectedMin}" aria-label="Prix minimum" class="price-range-input absolute w-full">
                    <input id="shop-price-max" type="range" min="${configuredMin}" max="${configuredMax}" step="1" value="${selectedMax}" aria-label="Prix maximum" class="price-range-input absolute w-full">
                  </div>
                  <div class="flex justify-between text-[9px] text-gray-400"><span>${configuredMin} DH</span><span>${configuredMax} DH</span></div>
                </div>
              </div>
            </div>

            <div class="lg:col-span-3">
              <div id="shop-products-grid-container" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-8">
                ${productsGrid}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("shop-back-home").onclick = () => { store.setPage("home"); };

      const shopSearch = document.getElementById("shop-search-input");
      if (shopSearch) {
        shopSearch.oninput = (e) => {
          store.searchQuery = e.target.value;
          store.renderShopPage();
        };
      }

      document.querySelectorAll(".category-filter-btn").forEach(btn => {
        btn.onclick = () => {
          store.selectedCategory = btn.getAttribute("data-name");
          const grid = document.getElementById("shop-products-grid-container");
          if (grid) grid.removeAttribute("id");
          store.renderShopPage();
        };
      });

      const priceMinInput = document.getElementById("shop-price-min");
      const priceMaxInput = document.getElementById("shop-price-max");
      const updatePriceFilter = (handle, value) => {
        const nextValue = Number(value);
        if (handle === 'min') store.priceMin = Math.min(nextValue, store.priceMax);
        else store.priceMax = Math.max(nextValue, store.priceMin);
        const label = document.getElementById("shop-price-range-label");
        if (label) label.textContent = `${store.priceMin} DH — ${store.priceMax} DH`;
        const fill = document.getElementById("shop-price-range-fill");
        if (fill) {
          const range = configuredMax - configuredMin || 1;
          fill.style.left = `${((store.priceMin - configuredMin) / range) * 100}%`;
          fill.style.right = `${100 - ((store.priceMax - configuredMin) / range) * 100}%`;
        }
        if (priceMinInput) priceMinInput.value = String(store.priceMin);
        if (priceMaxInput) priceMaxInput.value = String(store.priceMax);
        store.renderShopPage();
      };
      if (priceMinInput) priceMinInput.oninput = (e) => updatePriceFilter('min', e.target.value);
      if (priceMaxInput) priceMaxInput.oninput = (e) => updatePriceFilter('max', e.target.value);

      this.bindProductCardClicks();
    };

    store.renderAdminDashboard = function(container) {
      const normalizeDashboardStatus = status => {
        const normalized = String(status || 'pending').trim().toLowerCase();
        if (['cancelled', 'canceled', 'annulée', 'annulee', 'refused', 'rejected', 'refusée', 'refusee'].includes(normalized)) return 'cancelled';
        if (['pending', 'en attente', 'attente'].includes(normalized)) return 'pending';
        if (['confirmed', 'confirmée', 'confirmee'].includes(normalized)) return 'confirmed';
        if (['shipped', 'expédiée', 'expediee'].includes(normalized)) return 'shipped';
        if (['delivered', 'livrée', 'livree', 'processed'].includes(normalized)) return 'delivered';
        return normalized;
      };
      const isCancelledOrder = order => normalizeDashboardStatus(order.status) === 'cancelled';
      const revenueOrders = this.orders.filter(order => !isCancelledOrder(order));
      const totalRevenue = revenueOrders.reduce((sum, order) => sum + (Number(order.total) || 0), 0);
      const pendingOrders = this.orders.filter(order => normalizeDashboardStatus(order.status) === 'pending').length;
      const cancelledOrders = this.orders.filter(isCancelledOrder).length;
      const startOfToday = new Date();
      startOfToday.setHours(0, 0, 0, 0);
      const ordersToday = this.orders.filter(order => {
        const createdAt = order.createdAt?.toDate ? order.createdAt.toDate() : new Date(order.createdAt || 0);
        return !Number.isNaN(createdAt.getTime()) && createdAt >= startOfToday;
      }).length;
      const lowStockProducts = this.products.filter(product => {
        const stock = Number(product.stock);
        return product.isOutOfStock === true || product.limitedStock === true || (Number.isFinite(stock) && stock <= 3);
      }).length;
      const salesByProduct = new Map();
      revenueOrders.forEach(order => {
        (Array.isArray(order.items) ? order.items : []).forEach(item => {
          const quantity = Number(item.quantity) || 0;
          if (quantity <= 0) return;
          const baseId = String(item.id || item.productId || '').replace(/-v\d+(?:-[^-]+)?$/, '');
          const product = this.products.find(candidate => String(candidate.id) === baseId || String(candidate.name || '').trim().toLowerCase() === String(item.name || '').trim().toLowerCase());
          const key = product?.id || baseId || String(item.name || 'unknown');
          const current = salesByProduct.get(key) || { product, name: item.name || 'Produit sans nom', quantity: 0, revenue: 0 };
          current.quantity += quantity;
          current.revenue += quantity * (Number(item.price) || 0);
          salesByProduct.set(key, current);
        });
      });
      const bestProducts = [...salesByProduct.values()]
        .sort((a, b) => b.quantity - a.quantity || b.revenue - a.revenue)
        .slice(0, 5);

      const summaryCards = [
        ['clock', "Commandes aujourd'hui", ordersToday, 'Commandes créées depuis minuit'],
        ['banknote', 'Chiffre d’affaires', `${totalRevenue.toFixed(2)} MAD`, 'Hors commandes annulées ou refusées'],
        ['shopping-bag', 'Produits', this.products.length, 'Produits actuellement en boutique'],
        ['shield-check', 'Stock faible', lowStockProducts, 'Stock limité ou inférieur à 4 unités'],
        ['clock', 'Commandes en attente', pendingOrders, 'Statut : En attente'],
        ['x', 'Annulées / Refusées', cancelledOrders, 'Commandes exclues du chiffre d’affaires']
      ];

      container.innerHTML = `
        <div class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            ${summaryCards.map(([icon, label, value, detail]) => `
              <div class="bg-[#141414] p-5 rounded-2xl border border-luxuryGold/20 shadow-sm min-w-0">
                <div class="flex items-start justify-between gap-3">
                  <p class="text-[10px] uppercase tracking-wider text-luxuryGold font-bold">${label}</p>
                  <span class="text-luxuryGold/80">${getIconSvg(icon, 'w-5 h-5')}</span>
                </div>
                <p class="text-2xl sm:text-3xl font-serif font-bold text-white mt-3 break-words">${value}</p>
                <p class="text-[10px] text-gray-500 mt-2">${detail}</p>
              </div>
            `).join('')}

    store.renderAdminPromoCodes = function(container) {

      container.innerHTML = `
        <div class="bg-[#141414] rounded-3xl p-6 border border-luxuryGold/20 space-y-6">
          <div class="border-b border-white/10 pb-4">

            <div>
              <label class="block text-[10px] uppercase font-bold text-luxuryGold mb-1">Code</label>

            </div>
            <div>
              <label class="block text-[10px] uppercase font-bold text-luxuryGold mb-1">Discount %</label>

            </div>
            <div>
              <label class="block text-[10px] uppercase font-bold text-luxuryGold mb-1">Maximum uses</label>
              <input name="maxUses" type="number" min="1" step="1" required value="${editing?.maxUses ?? 1}" placeholder="1" class="w-full px-3 py-2 text-xs rounded-xl border border-luxuryGold/20 bg-black text-white">
            </div>
            <div>
              <label class="block text-[10px] uppercase font-bold text-luxuryGold mb-1">Expires (optional)</label>
              <input name="expiresAt" type="datetime-local" value="${editing?.expiresAt ? String(editing.expiresAt).slice(0, 16) : ''}" class="w-full px-3 py-2 text-xs rounded-xl border border-luxuryGold/20 bg-black text-white">
            </div>
            <div class="flex gap-2 items-center">
              <label class="flex items-center gap-2 text-xs text-white"><input name="isActive" type="checkbox" ${editing?.isActive !== false ? 'checked' : ''}> Active</label>
              <button type="submit" class="ml-auto px-4 py-2 bg-luxuryGold text-black rounded-xl text-[10px] uppercase font-bold">${editing ? 'Update' : 'Create'}</button>
            </div>
          </form>
          ${editing ? '<button id="promo-code-cancel-edit" type="button" class="text-[10px] text-gray-400 underline">Cancel edit</button>' : ''}
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-white">
              <thead class="bg-black uppercase font-bold border-b border-luxuryGold/25 text-luxuryGold"><tr><th class="p-4">Code</th><th class="p-4">Discount</th><th class="p-4">Uses</th><th class="p-4">Status</th><th class="p-4">Expiry</th><th class="p-4 text-right">Actions</th></tr></thead>
              <tbody class="divide-y divide-white/5">
                ${codes.map(promo => {
                  const expired = promo.expiresAt && new Date(promo.expiresAt).getTime() < Date.now();
                  return `<tr class="hover:bg-white/5"><td class="p-4 font-bold text-white">${promo.code}</td><td class="p-4 font-bold text-luxuryGold">${promo.discountPercent}%</td><td class="p-4 text-gray-300">${promo.usesCount || 0} / ${promo.maxUses ?? 1}</td><td class="p-4"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${promo.isActive !== false && !expired && (promo.usesCount || 0) < (promo.maxUses ?? 1) ? 'bg-emerald-950 text-emerald-300' : 'bg-red-950 text-red-300'}">${expired ? 'Expired' : (promo.usesCount || 0) >= (promo.maxUses ?? 1) ? 'Used Up' : promo.isActive !== false ? 'Active' : 'Disabled'}</span></td><td class="p-4 text-gray-400">${promo.expiresAt ? new Date(promo.expiresAt).toLocaleString() : 'Never'}</td><td class="p-4 text-right space-x-2"><button type="button" class="promo-edit-btn px-3 py-1 bg-luxuryGold text-black rounded text-[10px] uppercase font-bold" data-id="${promo.id}">Edit</button><button type="button" class="promo-toggle-btn px-3 py-1 bg-white/10 text-white rounded text-[10px] uppercase font-bold" data-id="${promo.id}">${promo.isActive !== false ? 'Disable' : 'Enable'}</button><button type="button" class="promo-delete-btn px-3 py-1 bg-red-700 text-white rounded text-[10px] uppercase font-bold" data-id="${promo.id}">Delete</button></td></tr>`;

      const refresh = () => { this.editingPromoCode = null; this.renderAdminPromoCodes(container); };
      document.getElementById('promo-code-admin-form').onsubmit = async event => {
        event.preventDefault();
        const form = event.target;
        const code = form.code.value.trim().toUpperCase();
        const discountPercent = Number(form.discountPercent.value);
        if (!/^[A-Z0-9_-]+$/.test(code) || !Number.isInteger(discountPercent) || discountPercent < 1 || discountPercent > 100) {
          showToast('Enter a valid code and discount from 1% to 100%.', 'error');
          return;
        }
        const duplicate = this.promoCodes.find(item => String(item.code).toUpperCase() === code && item.id !== editing?.id);
        if (duplicate) { showToast('That promo code already exists.', 'error'); return; }
        const maxUses = Number(form.maxUses.value);
        if (!Number.isInteger(maxUses) || maxUses < 1) { showToast('Maximum uses must be at least 1.', 'error'); return; }
        const payload = { code, discountPercent, maxUses, usesCount: editing?.usesCount || 0, isActive: form.isActive.checked, expiresAt: form.expiresAt.value ? new Date(form.expiresAt.value).toISOString() : null, updatedAt: new Date() };
        try {
          if (editing) await updateDoc(doc(promoRef, editing.id), payload);
          else { payload.createdAt = new Date(); await addDoc(promoRef, payload); }
          showToast(editing ? 'Promo code updated.' : 'Promo code created.');
          refresh();
        } catch (error) { showToast('Could not save promo code.', 'error'); }

      document.querySelectorAll('.promo-delete-btn').forEach(button => button.onclick = async () => { await deleteDoc(doc(promoRef, button.dataset.id)); showToast('Promo code deleted.'); });
    };

                  <label class="cursor-pointer bg-luxuryGold hover:bg-luxuryGold/80 text-black text-[9px] uppercase font-bold px-2 py-1 rounded flex items-center justify-center shrink-0">

                  </label>
                </div>

        listContainer.querySelectorAll('.var-stock-input').forEach(input => {
          input.oninput = e => { tempVariations[Number(input.dataset.index)].stock = Number(e.target.value || 0); };

        `).join('');
        listContainer.querySelectorAll('.color-name-input').forEach(input => input.oninput = e => { tempColors[Number(input.dataset.index)].name = e.target.value; });
        listContainer.querySelectorAll('.color-value-input').forEach(input => input.oninput = e => { tempColors[Number(input.dataset.index)].value = e.target.value; });
        listContainer.querySelectorAll('.color-image-input').forEach(input => input.oninput = e => { tempColors[Number(input.dataset.index)].imageURL = e.target.value; });
        listContainer.querySelectorAll('.color-file-upload').forEach(upload => upload.onchange = event => {
          const file = event.target.files?.[0];
          const index = Number(upload.dataset.index);
          if (!file) return;
          window.compressImageFile(file, base64 => {
            tempColors[index].imageURL = base64;
            const imageInput = listContainer.querySelector(`.color-image-input[data-index="${index}"]`);
            if (imageInput) imageInput.value = base64;
            showToast(`Color image uploaded: ${file.name}`);
          });
        });
        listContainer.querySelectorAll('.color-variant-input').forEach(input => input.onchange = e => {
          const color = tempColors[Number(input.dataset.index)];
          if (e.target.value === 'main') {
            color.variantIndex = null;
            color.variantName = 'main';
          } else {
            color.variantIndex = Number(e.target.value);
            color.variantName = tempVariations[color.variantIndex]?.name || '';
          }
        });
        listContainer.querySelectorAll('.remove-color-btn').forEach(button => button.onclick = () => { tempColors.splice(Number(button.dataset.index), 1); renderColorsList(); });
      };

      document.getElementById("add-variation-row-btn").onclick = () => {
        tempVariations.push({ name: '', price: '', imageURL: '', mobileImage: '', description: '', stock: 0, sizes: [] });
        renderVariationsList();
      };

      document.getElementById("add-size-row-btn").onclick = () => {
        tempSizes.push({ label: '', stock: 0 });
        renderSizesList();
      };

      renderVariationsList();
      renderSizesList();
      renderColorsList();

      document.getElementById("add-color-row-btn").onclick = () => {
        tempColors.push({ name: '', value: '#000000' });
        renderColorsList();
      };

      // Bind Local PC File Upload Actions for Product Form
      const mainImgFileInput = document.getElementById("prod-form-img-file");
      if (mainImgFileInput) {
        mainImgFileInput.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            window.compressImageFile(file, (base64) => {
              const urlInput = document.getElementById("prod-form-img-url");
              if (urlInput) {
                urlInput.value = base64;
                showToast("Product image uploaded successfully!");
              }
            });
          }
        };
      }

      const galleryImgFileInput = document.getElementById("prod-form-gallery-file");
      if (galleryImgFileInput) {
        galleryImgFileInput.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            window.compressImageFile(file, (base64) => {
              const galleryInput = document.getElementById("prod-form-gallery-urls");
              if (galleryInput) {
                const currentVal = galleryInput.value.trim();
                galleryInput.value = currentVal ? currentVal + ", " + base64 : base64;
                showToast("Gallery image uploaded and appended successfully!");
              }
            });
          }
        };
      }

      document.querySelectorAll(".image-upload-trigger").forEach((uploadInput) => {
        uploadInput.onchange = (e) => {
          const file = e.target.files[0];
          const targetName = uploadInput.dataset.target;
          if (!file || !targetName) return;

          window.compressImageFile(file, (base64) => {
            const targetField = document.querySelector(`[name="${targetName}"]`);
            if (targetField) {
              targetField.value = base64;
              showToast(`${targetName.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase())} image uploaded successfully!`);
            }
          });
        };
      });

      document.getElementById("form-cancel-btn").onclick = () => container.classList.add("hidden");

      document.getElementById("product-edit-form").onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const validSizes = tempSizes
          .map(size => ({
            label: String(size.label || '').trim(),
            stock: Number(size.stock || 0)
          }))
          .filter(size => size.label && size.stock >= 0);

        const payload = {
          name: form.name.value,
          category: form.category.value,
          price: Number(form.price.value),
          discountPrice: form.discountPrice.value ? Number(form.discountPrice.value) : null,
          imageURL: form.imageURL.value,
          storeImage: form.storeImage?.value || '',
          homeImage: form.homeImage?.value || '',
          mobileImage: form.mobileImage?.value || '',
          desktopImage: form.desktopImage?.value || '',
          tabletImage: form.tabletImage?.value || '',
          galleryImages: form.galleryImages.value,
          variations: tempVariations.filter(v => v.imageURL || v.mobileImage || v.name).map(v => ({
            ...v,
            stock: Number(v.stock || 0),
            sizes: (v.sizes || []).map(size => ({ label: String(size.label || '').trim(), stock: Number(size.stock || 0) })).filter(size => size.label),
            mobileImage: v.mobileImage || ''
          })),
          colors: tempColors.filter(color => color.name && color.value).map(color => ({
            ...color,
            variantIndex: color.variantName === 'main' ? null : (tempVariations.length > 0 ? (Number.isInteger(color.variantIndex) ? color.variantIndex : 0) : null),
            variantName: color.variantName === 'main' ? 'main' : (tempVariations.length > 0 ? (tempVariations[Number.isInteger(color.variantIndex) ? color.variantIndex : 0]?.name || color.variantName || '') : '')
          })),
          sizes: validSizes,
          description: window.preserveDescriptionText(form.description.value),
          stock: Number(form.stock.value),
          rating: Number(form.rating.value),
          isPinned: form.isPinned.checked,
          isPromotion: form.isPromotion.checked,
          isBestSeller: form.isBestSeller.checked,
          limitedStock: form.limitedStock.checked,
          isOutOfStock: form.isOutOfStock.checked,
          freeDelivery: form.freeDelivery.checked,
          updatedAt: new Date()
        };

        try {
          const firestorePayload = await window.prepareProductPayloadForFirestore(payload);
          const safePayload = await window.tryCompactProductPayload(firestorePayload);

          if (product) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', product.id), safePayload);
            const productIndex = store.products.findIndex(item => item.id === product.id);
            if (productIndex >= 0) store.products[productIndex] = { ...store.products[productIndex], ...safePayload };
            showToast("Product updated successfully.");
          } else {
            safePayload.createdAt = new Date();
            safePayload.reviewsCount = 0;
            const createdProduct = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), safePayload);
            store.products.push({ id: createdProduct.id, ...safePayload });
            showToast("New product created successfully.");
          }
          container.classList.add("hidden");
          store.updateDOM();
        } catch (err) {
          console.error("Error writing product.", err);
          showToast("Error writing product.", "error");
        }
      };
    };

    store.renderAdminOrders = function(container) {

                    </td>
                    <td class="p-4">
                      <p class="text-[10px] font-bold text-luxuryGold uppercase">${o.paymentMethod || 'Cash on Delivery'}</p>
                      ${o.paymentMethod === 'Bank Transfer' || o.paymentMethod === 'bank' ? `
                        <div class="mt-2 space-y-1">

                              <p class="text-gray-400">RIB: <span class="font-mono text-gray-300">${o.bankSnapshot.rib}</span></p>
                            </div>
                          ` : ''}
                          ${o.paymentProofName ? `<p class="text-[9px] text-gray-400 mt-1">Proof: ${o.paymentProofName}</p>` : `<p class="text-[9px] text-gray-400 mt-1">No proof uploaded</p>`}

                      ` : ''}

                    <td class="p-4 font-serif font-bold text-luxuryGold">${o.total} MAD</td>
                    <td class="p-4">
                      <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${statusStyles[normalizeOrderStatus(o.status)] || statusStyles.pending}">${normalizeOrderStatus(o.status)}</span>

              </tbody>
            </table>

            showToast(`Order status updated to ${nextStatus}.`);
          } catch (err) {

    store.renderAdminReviews = function(container) {
      if (!this.isAdmin) return;

      const filteredReviews = this.reviews.filter(review => activeFilter === 'all' || (review.status || 'pending') === activeFilter);
      container.innerHTML = `
        <div class="bg-[#141414] rounded-3xl p-6 border border-luxuryGold/20 space-y-6">
          <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
              <p class="text-[10px] uppercase tracking-[0.25em] text-luxuryGold font-bold">Avis clients</p>
              <h3 class="font-serif text-xl text-white">Modération des avis</h3>
            </div>
            <div class="flex flex-wrap gap-2">
              ${[['all', 'Tous'], ['pending', 'En attente'], ['approved', 'Approuvé'], ['rejected', 'Refusé']].map(([value, label]) => `<button class="admin-review-filter rounded-lg px-3 py-2 text-[10px] font-bold uppercase tracking-wider ${activeFilter === value ? 'bg-luxuryGold text-black' : 'border border-white/10 text-gray-400 hover:text-white'}" data-filter="${value}">${label}</button>`).join('')}
            </div>
          </div>
          <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
            ${filteredReviews.length ? filteredReviews.map(review => `
              <article class="p-5 bg-black/60 rounded-2xl border border-luxuryGold/20 flex flex-col justify-between gap-4">
                <div class="space-y-2">
                  <div class="flex items-start justify-between gap-3">
                    <div>
                      <h4 class="font-serif font-bold text-luxuryGold">${escapeHtml(review.productName || this.products.find(product => String(product.id) === String(review.productId))?.name || 'Produit')}</h4>
                      <p class="text-[10px] text-gray-500">${escapeHtml(review.customerName || 'Client SOVANEX')} ${review.customerEmail ? `· ${escapeHtml(review.customerEmail)}` : ''}</p>
                    </div>
                    <span class="rounded-full border border-white/10 px-2 py-1 text-[9px] font-bold uppercase text-gray-300">${statusLabels[review.status || 'pending'] || 'En attente'}</span>
                  </div>
                  <div class="text-sm text-amber-500">${this.getRatingStarsMarkup(review.rating)}</div>
                  <p class="text-xs text-gray-300 italic">"${escapeHtml(review.comment)}"</p>
                  <p class="text-[10px] text-gray-500">${formatReviewDate(review.createdAt)}</p>

                <div class="flex flex-wrap justify-end gap-2">
                  ${review.status !== 'approved' ? `<button class="review-status-btn rounded-lg bg-emerald-700 px-3 py-2 text-[9px] font-bold uppercase text-white" data-id="${review.id}" data-status="approved">Approuver</button>` : ''}
                  ${review.status !== 'rejected' ? `<button class="review-status-btn rounded-lg bg-amber-700 px-3 py-2 text-[9px] font-bold uppercase text-white" data-id="${review.id}" data-status="rejected">Refuser</button>` : ''}
                  <button class="delete-review-btn rounded-lg bg-red-800 px-3 py-2 text-[9px] font-bold uppercase text-white" data-id="${review.id}">Supprimer</button>
                </div>
              </article>
            `).join('') : '<p class="text-xs text-gray-500">Aucun avis dans cette catégorie.</p>'}
          </div>
        </div>
      `;

      document.querySelectorAll('.admin-review-filter').forEach(button => {
        button.onclick = () => {
          this.adminReviewFilter = button.dataset.filter || 'all';
          this.renderAdminReviews(container);
        };
      });

      document.querySelectorAll('.review-status-btn').forEach(button => {
        button.onclick = async () => {
          if (!this.isAdmin) return;
          button.disabled = true;
          try {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reviews', button.dataset.id), {
              status: button.dataset.status,
              moderatedAt: serverTimestamp(),
              moderatedBy: auth.currentUser?.uid || null
            });
            showToast(button.dataset.status === 'approved' ? 'Avis approuvé.' : 'Avis refusé.');
          } catch (error) {
            console.error('Review moderation failed:', error);
            showToast('Impossible de modifier cet avis.', 'error');
            button.disabled = false;
          }
        };
      });

      document.querySelectorAll(".delete-review-btn").forEach(btn => {
        btn.onclick = () => {
          if (!this.isAdmin) return;
          const id = btn.getAttribute("data-id");
          triggerConfirm("Supprimer l’avis", "Voulez-vous vraiment supprimer cet avis client ?", async () => {
            try {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reviews', id));

              console.error('Review deletion failed:', error);
              showToast('Impossible de supprimer cet avis.', 'error');

          });
        };
      });

      // Bind Local PC File Upload Actions for General Settings Form

          const file = e.target.files[0];
          if (file) {
            window.compressImageFile(file, (base64) => {
              const urlInput = document.getElementById("settings-hero2-url");
              if (urlInput) {
                urlInput.value = base64;

            });
          }

      const hero3FileInput = document.getElementById("settings-hero3-file");

          if (file) {
            window.compressImageFile(file, (base64) => {

              if (urlInput) {
                urlInput.value = base64;
                showToast("Hero image 3 uploaded successfully!");
              }
            });
          }
        };
      }

      // Bank account management handlers
      const bankSettingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
      const persistBankAccounts = async (accounts) => {
        const normalizedAccounts = accounts.map(account => ({ ...account }));
        store.settings = { ...store.settings, bankAccounts: normalizedAccounts };
        store.bankAccounts = normalizedAccounts;
        localStorage.setItem("sovanex_settings", JSON.stringify(store.settings));
        await setDoc(bankSettingsRef, { bankAccounts: normalizedAccounts }, { merge: true });
      };

      const clearBankEditForm = () => {
        document.querySelectorAll(".admin-bank-add-name, .admin-bank-add-holder, .admin-bank-add-number, .admin-bank-add-rib, .admin-bank-add-iban, .admin-bank-add-logo-url").forEach(input => { input.value = ''; });
        const addButton = document.querySelector(".admin-bank-add-btn");
        if (addButton) delete addButton.dataset.editIndex;
        document.getElementById("admin-bank-form-title")?.replaceChildren(document.createTextNode("Add New Bank Account"));
        document.querySelector(".admin-bank-cancel-edit")?.classList.add("hidden");

        btn.onclick = () => {

          if (!account) return;
          document.querySelector(".admin-bank-add-name").value = account.bankName || '';
          document.querySelector(".admin-bank-add-holder").value = account.accountHolderName || '';
          document.querySelector(".admin-bank-add-number").value = account.accountNumber || '';
          document.querySelector(".admin-bank-add-rib").value = account.rib || '';
          document.querySelector(".admin-bank-add-iban").value = account.iban || '';
          document.querySelector(".admin-bank-add-logo-url").value = account.logoURL || '';
          const addButton = document.querySelector(".admin-bank-add-btn");
          addButton.dataset.editIndex = String(idx);
          document.getElementById("admin-bank-form-title")?.replaceChildren(document.createTextNode("Edit Bank Account"));
          document.querySelector(".admin-bank-cancel-edit")?.classList.remove("hidden");

      document.querySelector(".admin-bank-add-logo-file")?.addEventListener("change", (event) => {

      document.querySelectorAll(".admin-toggle-bank-status").forEach(btn => {

          if (bankAccountsJson) {
            try {
              const accounts = JSON.parse(bankAccountsJson.value);
              if (accounts[idx]) {
                accounts[idx].isActive = !accounts[idx].isActive;
                bankAccountsJson.value = JSON.stringify(accounts);
                persistBankAccounts(accounts)
                  .then(() => {
                    showToast(accounts[idx].isActive ? "Bank account enabled." : "Bank account disabled.");
                    store.renderAdminGeneralSettings(document.getElementById("app-content"));

      document.querySelectorAll(".admin-delete-bank").forEach(btn => {

          if (bankAccountsJson) {
            try {
              const accounts = JSON.parse(bankAccountsJson.value);
              const deleted = accounts[idx];
              accounts.splice(idx, 1);
              bankAccountsJson.value = JSON.stringify(accounts);
              persistBankAccounts(accounts)

                  showToast(`Bank account ${deleted.bankName} deleted.`);

              console.error("Error deleting bank account:", err);

        };

      document.querySelectorAll(".admin-bank-add-btn").forEach(btn => {
