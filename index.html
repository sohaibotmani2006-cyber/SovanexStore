          const numberInput = document.querySelector(".admin-bank-add-number");
          const ribInput = document.querySelector(".admin-bank-add-rib");
          const ibanInput = document.querySelector(".admin-bank-add-iban");
          const logoInput = document.querySelector(".admin-bank-add-logo-url");

          const bankName = nameInput?.value.trim();
          const accountHolderName = holderInput?.value.trim();
          const accountNumber = numberInput?.value.trim();
          const rib = ribInput?.value.trim();
          const iban = ibanInput?.value.trim();
          const logoURL = logoInput?.value.trim() || '';

          if (!bankName || !accountHolderName || !accountNumber || !rib || !iban) {
            showToast("Please fill in all bank account fields.", "error");
            return;
          }

          const bankAccountsJson = document.getElementById("admin-bank-accounts-json");
          if (bankAccountsJson) {
            try {
              const accounts = JSON.parse(bankAccountsJson.value);
              const newBank = {
                id: "bank_" + Date.now(),
                bankName,
                accountHolderName,
                accountNumber,
                rib,
                iban,
                logoURL,
                isActive: true
              };
              const editIndex = Number(btn.dataset.editIndex);
              if (Number.isInteger(editIndex) && editIndex >= 0 && accounts[editIndex]) {
                accounts[editIndex] = { ...accounts[editIndex], ...newBank, id: accounts[editIndex].id };
              } else {
                accounts.push(newBank);
              }
              bankAccountsJson.value = JSON.stringify(accounts);
              persistBankAccounts(accounts)
                .then(() => {
                  clearBankEditForm();
                  showToast(editIndex >= 0 ? `Bank account ${bankName} updated successfully.` : `Bank account ${bankName} added successfully.`);
                  store.renderAdminGeneralSettings(document.getElementById("app-content"));
                })
                .catch(err => showToast("Could not save bank account: " + err.message, "error"));
            } catch (err) {
              console.error("Error adding bank account:", err);
              showToast("Error adding bank account.", "error");
            }
          }
        };
      });

      const generalSettingsForm = document.getElementById("general-settings-form");
      const saveButton = document.getElementById("general-settings-save-btn");
      const settingsStatus = document.getElementById("general-settings-status");
      const setSettingsStatus = (message, type = 'info') => {
        if (!settingsStatus) return;
        settingsStatus.textContent = message;
        settingsStatus.className = `text-[10px] ${type === 'error' ? 'text-red-300' : type === 'success' ? 'text-emerald-300' : 'text-gray-400'}`;
      };
      generalSettingsForm.querySelectorAll('input, textarea, select').forEach(field => {
        field.addEventListener('input', () => { generalSettingsForm.dataset.dirty = 'true'; setSettingsStatus('Modifications non enregistrées.'); });
        field.addEventListener('change', () => { generalSettingsForm.dataset.dirty = 'true'; setSettingsStatus('Modifications non enregistrées.'); });
      });
      const beforeUnloadHandler = event => {
        if (generalSettingsForm.dataset.dirty === 'true') {
          event.preventDefault();
          event.returnValue = '';
        }
      };
      if (this.generalSettingsBeforeUnloadHandler) {
        window.removeEventListener('beforeunload', this.generalSettingsBeforeUnloadHandler);
      }
      this.generalSettingsBeforeUnloadHandler = beforeUnloadHandler;
      window.addEventListener('beforeunload', beforeUnloadHandler);

      generalSettingsForm.onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        if (saveButton) {
          saveButton.disabled = true;
          saveButton.textContent = 'Enregistrement...';
        }
        setSettingsStatus('Enregistrement en cours...');
        
        // Get bank accounts from hidden input
        let bankAccounts = [];
        const bankAccountsJson = document.getElementById("admin-bank-accounts-json");
        if (bankAccountsJson) {
          try {
            bankAccounts = JSON.parse(bankAccountsJson.value);
          } catch (err) {
            console.warn("Error parsing bank accounts JSON", err);
            bankAccounts = this.paymentSettingsDefaults.bankAccounts;
          }
        }

        const configuredPriceMin = Math.max(0, Number(form.priceFilterMin.value || 0));
        const configuredPriceMax = Math.max(0, Number(form.priceFilterMax.value || 0));
        if (configuredPriceMax < configuredPriceMin) {
          showToast("Le prix maximum doit être supérieur ou égal au prix minimum.", "error");
          return;
        }

        const getFieldValue = (name, fallback = '') => form.elements.namedItem(name)?.value ?? this.settings[name] ?? fallback;
        const payload = {
          ...this.settings,
          logoURL: getFieldValue('logoURL', this.settings.logoURL || ''),
          faviconURL: getFieldValue('faviconURL', this.settings.faviconURL || ''),
          websiteName: getFieldValue('websiteName', this.settings.websiteName || 'SOVANEX'),
          brandName: getFieldValue('brandName', this.settings.brandName || 'SOVANEX'),
          websiteTitle: getFieldValue('websiteTitle', this.settings.websiteTitle || ''),
          shortDescription: getFieldValue('shortDescription', this.settings.shortDescription || ''),
          websiteURL: getFieldValue('websiteURL', this.settings.websiteURL || ''),
          seoTitle: getFieldValue('seoTitle', this.settings.seoTitle || ''),
          seoDescription: getFieldValue('seoDescription', this.settings.seoDescription || ''),
          seoKeywords: getFieldValue('seoKeywords', this.settings.seoKeywords || ''),
          ogTitle: getFieldValue('ogTitle', this.settings.ogTitle || ''),
          ogDescription: getFieldValue('ogDescription', this.settings.ogDescription || ''),
          ogImage: getFieldValue('ogImage', this.settings.ogImage || ''),
          robotsIndexing: form.elements.namedItem('robotsIndexing')?.checked ?? this.settings.robotsIndexing !== false,
          canonicalURL: getFieldValue('canonicalURL', this.settings.canonicalURL || ''),
          heroTitleEn: form.heroTitleEn.value,
          heroTitleAr: form.heroTitleAr.value,
          heroDescEn: form.heroDescEn.value,
          heroDescAr: form.heroDescAr.value,
          heroImg1: form.heroImg1.value,
          heroImg2: form.heroImg2.value,
          heroImg3: form.heroImg3.value,
          tagline: form.tagline.value,
          storeName: getFieldValue('storeName', this.settings.storeName || 'SOVANEX'),
          defaultLanguage: getFieldValue('defaultLanguage', this.settings.defaultLanguage || 'fr'),
          currency: getFieldValue('currency', this.settings.currency || 'MAD'),
          aboutWebsite: getFieldValue('aboutWebsite', this.settings.aboutWebsite || ''),
          businessAddress: getFieldValue('businessAddress', this.settings.businessAddress || ''),
          businessCity: getFieldValue('businessCity', this.settings.businessCity || ''),
          businessCountry: getFieldValue('businessCountry', this.settings.businessCountry || ''),
          phoneNumber: getFieldValue('phoneNumber', this.settings.phoneNumber || ''),
          whatsappHotline: form.whatsappHotline.value,
          instagramURL: getFieldValue('instagramURL', this.settings.instagramURL || ''),
          facebookURL: getFieldValue('facebookURL', this.settings.facebookURL || ''),
          tiktokURL: getFieldValue('tiktokURL', this.settings.tiktokURL || ''),
          youtubeURL: getFieldValue('youtubeURL', this.settings.youtubeURL || ''),
          pinterestURL: getFieldValue('pinterestURL', this.settings.pinterestURL || ''),
          otherSocialURL: getFieldValue('otherSocialURL', this.settings.otherSocialURL || ''),
          footerDescription: getFieldValue('footerDescription', this.settings.footerDescription || ''),
          footerContact: getFieldValue('footerContact', this.settings.footerContact || ''),
          copyrightText: getFieldValue('copyrightText', this.settings.copyrightText || ''),
          websiteDescription: form.websiteDescription.value,
          deliveryTerms: form.deliveryTerms.value,
          returnPolicy: form.returnPolicy.value,
          freeDeliveryThreshold: Number(form.freeDeliveryThreshold?.value || this.getFreeDeliveryThreshold()),
          priceFilterMin: configuredPriceMin,
          priceFilterMax: configuredPriceMax,
          paymentMethods: {
            cod: form.codEnabled.checked,
            bank: form.bankEnabled.checked
          },
          paymentProofRequired: form.paymentProofRequired.checked,
          bankInstructions: form.bankInstructions.value,
          bankAccountInfo: form.bankAccountInfo.value,
          bankAccounts: bankAccounts
        };
        payload.announcements = tempAnnouncements.map((item, order) => ({ ...item, order }));

        localStorage.setItem("sovanex_settings", JSON.stringify(payload));
        store.settings = { ...store.settings, ...payload };
        updateFavicon(store.settings.faviconURL || store.settings.logoURL);
        store.bankAccounts = bankAccounts;

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), payload, { merge: true });

          setSettingsStatus('Modifications enregistrées.', 'success');

          console.error("Cloud save failed.", err);
          setSettingsStatus('Erreur lors de la sauvegarde distante.', 'error');
          showToast("Impossible d’enregistrer les paramètres dans Firebase.", "error");
        } finally {
          if (saveButton) {
            saveButton.disabled = false;
            saveButton.textContent = 'Enregistrer les modifications';
          }
        }
      };
    };

    store.submitCheckoutOrder = async function(name, phone, cityId, address) {
      if (this.checkoutLoading) {
        console.warn('Checkout already in progress, preventing double submission');
        return;
      }

      const paymentMethod = this.checkoutFormValues.paymentMethod || 'cod';
      const paymentProofData = this.checkoutFormValues.paymentProofData || '';
      const paymentProofName = this.checkoutFormValues.paymentProofName || '';
      const selectedBankId = this.checkoutFormValues.selectedBankId || '';

      this.checkoutLoading = true;

      try {
        let bankSnapshot = null;
        if (paymentMethod === 'bank' && selectedBankId) {
          bankSnapshot = this.getBankAccountById(selectedBankId);
        }

        const result = await this.submitUnifiedOrder({
          customerName: name,
          phone,
          cityId,
          address,
          paymentMethod,
          paymentStatus: paymentMethod === 'cod' ? 'Pending' : 'Proof Submitted',
          paymentProofData,
          paymentProofName,
          selectedBankId,
          bankSnapshot

    store.processCheckoutPage = async function(e) {
      const formEl = e.target;
      const name = formEl.customerName.value;
      const phone = formEl.phone.value;
      const cityId = formEl.cityId.value;
      const address = formEl.address.value;
      const paymentMethod = (formEl.paymentMethod && formEl.paymentMethod.value) || 'cod';
      const paymentProofData = (formEl.paymentProofData && formEl.paymentProofData.value) || this.checkoutFormValues.paymentProofData || '';
      const paymentProofName = (formEl.paymentProofName && formEl.paymentProofName.value) || this.checkoutFormValues.paymentProofName || '';
      const selectedBankId = this.checkoutFormValues.selectedBankId || '';

      if (this.checkoutLoading) return;

      // If bank transfer selected and no bank chosen yet, take user to bank selection
      if (paymentMethod === 'bank' && !selectedBankId) {
        this.checkoutPage = "bank-selection";
        this.renderCartPage();
        showToast("Please select a bank account to continue.", "info");
        return;
      }

      this.checkoutLoading = true;
      this.renderCartPage();

      try {
        let bankSnapshot = null;
        if (paymentMethod === 'bank' && selectedBankId) {
          bankSnapshot = this.getBankAccountById(selectedBankId);
        }

        const result = await this.submitUnifiedOrder({
          customerName: name,
          phone,
          cityId,
          address,
          paymentMethod,
          paymentStatus: paymentMethod === 'cod' ? 'Pending' : 'Proof Submitted',
          paymentProofData,
          paymentProofName,
          selectedBankId,
          bankSnapshot
        });

        if (!result) {
          this.checkoutLoading = false;
          this.renderCartPage();
          return;
        }

        const purchasedItemIds = this.cart.map(item => item.id);
        localStorage.setItem("sovanex_last_purchased_ids", JSON.stringify(purchasedItemIds));

        if (typeof fbq !== 'undefined') {
          fbq('track', 'Purchase', {
            value: result.orderData.total,
            currency: 'MAD',
            contents: result.orderData.items.map(item => ({ id: item.id, quantity: item.quantity })),
            content_type: 'product'
          });
        }

        this.cart = [];
        localStorage.setItem("bp_cart", JSON.stringify([]));
        this.checkoutFormValues = { customerName: "", phone: "", cityId: "", address: "", paymentMethod: "cod", selectedBankId: "", paymentProofData: "", paymentProofName: "" };
        this.checkoutPage = "payment-method";
        this.checkoutLoading = false;
        this.setPage("order-confirmation");

      } catch (err) {
        console.error(err);
        showToast("Order checkout pipeline failed. Please try again.", "error");
        this.checkoutLoading = false;
        this.renderCartPage();
      } finally {
        // Order completed successfully - page changed to order-confirmation
        // Don't re-render cart page as it would overwrite the confirmation page
      }
    };

          </div>

      // Legacy fallback gallery loader

          let processed = [];
          for (let i = 0; i < rawParts.length; i++) {
            if (rawParts[i].startsWith('data:image') && i + 1 < rawParts.length) {
              processed.push(rawParts[i] + ',' + rawParts[i+1]);

        : '<p class="text-xs text-gray-500">Aucun avis pour le moment</p>';

      modal.innerHTML = `
        ${isProductPage ? '' : '<div class="fixed inset-0 bg-black/85 backdrop-blur-xs transition-opacity duration-300 opacity-0" id="product-modal-backdrop"></div>'}

            <img id="main-product-image" src="${this.activeImg || fallbackImage}" class="w-full h-full object-cover transition-all duration-500 ease-in-out transform group-hover/main:scale-105" alt="${cleanName}, produit SOVANEX">
            ${product.discountPrice && Number(product.price) > Number(product.discountPrice) ? `<span class="absolute top-4 left-4 bg-luxuryGold text-black text-[10px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">-${Math.round((1 - (Number(product.discountPrice) / Number(product.price))) * 100)}%</span>` : ''}

                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                  ${this.t('shareLink')}

              <p id="modal-stock-status" class="text-[11px] font-medium text-gray-400">
                État du stock : ${isOutOfStock ? '<span class="text-amber-300 font-bold">Rupture de stock</span>' : product.limitedStock ? `<span class="text-red-400 font-bold">Stock limité (${getCurrentAvailableStock()} restant)</span>` : `<span class="text-emerald-400 font-bold">En stock</span>`}
              </p>
            </div>

            <div class="space-y-3 pt-3 border-t border-white/5 flex-shrink-0">

                  <button type="button" id="modal-qty-increase" class="h-9 w-9 rounded-full border border-white/15 bg-black/30 text-lg text-white hover:border-luxuryGold">+</button>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <button id="modal-order-now-btn" ${isOutOfStock ? 'disabled' : ''} class="py-2.5 md:py-3.5 ${isOutOfStock ? 'bg-white/10 text-gray-500 cursor-not-allowed' : 'bg-luxuryGold hover:bg-luxuryGold/90 text-black'} font-extrabold uppercase tracking-widest text-[10px] md:text-[11px] rounded-xl transition transform hover:scale-[1.02]">${isOutOfStock ? 'Rupture de stock' : this.t('orderNow')}</button>
                <button id="modal-add-to-cart-btn" ${isOutOfStock ? 'disabled' : ''} class="py-2.5 md:py-3.5 border ${isOutOfStock ? 'border-white/10 text-gray-500 cursor-not-allowed' : 'border-luxuryGold text-luxuryGold hover:bg-luxuryGold hover:text-black'} font-extrabold uppercase tracking-widest text-[10px] md:text-[11px] rounded-xl transition shadow-xs">${isOutOfStock ? 'Rupture de stock' : this.t('addToCart')}</button>

                  <h3 id="product-reviews-title" class="font-serif text-xl text-white">${productRating.average ? productRating.average.toFixed(1) : '0.0'}/5 <span class="text-xs text-gray-400">(${productRating.count} avis)</span></h3>

                <div>
                  <label class="mb-1 block text-[10px] uppercase tracking-wider text-gray-400">Votre note</label>
                  <select name="rating" required class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-xs text-white focus:border-luxuryGold focus:outline-none">

              </form>

          </div>
        </div>
      `;

      const closeModal = () => {
        if (isProductPage) {
          store.setPage('shop');
          return;
        }
        const modalBg = document.getElementById("product-modal-backdrop");
        const modalContent = document.getElementById("product-modal-content");
        if (modalBg) modalBg.classList.replace("opacity-100", "opacity-0");
        if (modalContent) {
          modalContent.classList.remove("animate-modal-enter");
          modalContent.classList.add("animate-modal-leave");
        }
          setTimeout(() => {
          modal.classList.add("hidden");
          store.currentlyOpenProductId = null; // Reset open product state
          const pagePath = store.currentPage === 'home' ? '/' : '/' + store.currentPage;

        if (!priceWrapperEl) return;
        const numericCurrent = Number(currentPrice ?? 0);

        const hasPromo = numericOriginal > 0 && numericCurrent > 0 && numericCurrent < numericOriginal;

        if (hasPromo) {
          priceWrapperEl.innerHTML = `
            <div class="inline-flex items-center gap-2 rounded-2xl border border-[#f5d76e]/50 bg-gradient-to-r from-[#f5d76e]/15 via-[#d4af37]/15 to-[#1a1a1a] px-3 py-2 shadow-[0_0_22px_rgba(245,215,110,0.18)]">

    async function initAppSequence() {
      try {
        let user = auth.currentUser;
        if (!user) {
          const customToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
          if (customToken) {
            try {
              const credential = await signInWithCustomToken(auth, customToken);
              user = credential.user;
            } catch (tokenError) {
              console.warn("Firebase Auth: Custom token mismatch. Bypassing to Anonymous Authentication.", tokenError);
              const credential = await signInAnonymously(auth);
              user = credential.user;
            }
          } else {
            const credential = await signInAnonymously(auth);
            user = credential.user;
          }
        }
        
        if (user) {
          store.user = user;
          store.initPublicSubscriptions();
          if (store.isAdmin) {
            store.initAdminSubscriptions();
          }
        }
      } catch (error) {
        console.error("Firebase Auth Failure:", error);
        
        if (error.code === 'auth/operation-not-allowed') {
          showFirebaseDiagnosticModal(
            "Anonymous Auth Disabled",
            "SOVANEX cannot identify connection credentials because 'Anonymous Sign-In' is disabled inside your Firebase Console."
          );
        } else {
          showFirebaseDiagnosticModal(
            "Firebase Initialization Alert",
            "Authentication returned: " + error.message + ". Ensure your Firestore Rules allow connection access."
          );
        }

        store.initPublicSubscriptions(true); 
      }
    }

      const validPages = ['home', 'shop', 'contact', 'orders', 'wishlist', 'policies', 'admin', 'cart', 'bank-transfer', 'order-confirmation'];

      store.updateDOM();

      const savedScrollPosition = Number(sessionStorage.getItem(`sovanex_scroll_${window.location.pathname}`) || 0);
      if (savedScrollPosition > 0) {
        requestAnimationFrame(() => window.scrollTo(0, savedScrollPosition));
      }

      window.addEventListener('beforeunload', () => {
        sessionStorage.setItem(`sovanex_scroll_${window.location.pathname}`, String(window.scrollY));
      });

      initAppSequence().then(() => store.handleRouting());

      window.addEventListener("popstate", () => {
        store.handleRouting();

          store.initPublicSubscriptions();
          
          if (store.isAdmin) {
            store.initAdminSubscriptions();
            if (store.currentPage === "admin") {
              store.renderAdminPage();
            }
          }
        } else {
          store.cleanupSubscriptions("admin");
          store.cleanupSubscriptions("public");
           signInAnonymously(auth).catch(console.error);
        }
      });
    });
  </script>
</body>
</html>
